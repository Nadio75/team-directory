name: Verify required files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README.md and NOTES.md exist
        run: |
          test -f README.md && test -f NOTES.md